[workspace]
resolver = "2"
members = [
    "crates/rayarchy-core",
    "crates/rayarchy-daemon",
    "crates/rayarchy-cli",
    "crates/rayarchy-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
